    <text x="38" y="200.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1f24">1</text>

    <!-- parada 2 -->
    <circle cx="96" cy="106" r="11" fill="#e0a327"/>
    <text x="96" y="110.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1f24">2</text>

    <!-- pin final (destino) -->
